# 只自动发布仓库变量 NAV_PAGES_BRANCH 指定的分支；未设置时使用仓库默认分支。
name: Deploy to GitHub Pages

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.choose.outputs.publish }}
    steps:
      - id: choose
        uses: actions/github-script@v7
        env:
          NAV_PAGES_BRANCH: ${{ vars.NAV_PAGES_BRANCH }}
        with:
          script: |
            const branch = context.ref.startsWith('refs/heads/') ? context.ref.slice(11) : '';
            const target = process.env.NAV_PAGES_BRANCH || context.payload.repository.default_branch;
            core.setOutput('publish', Boolean(branch && (context.eventName === 'workflow_dispatch' || branch === target)));

  build:
    needs: select
    if: needs.select.outputs.publish == 'true'
    concurrency:
      group: pages-build
      cancel-in-progress: true
    runs-on: ubuntu-latest
    env:
      NAV_GITHUB_PAGES: 'true'
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/configure-pages@v5
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build-gh-pages
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/browser

  deploy:
    needs: build
    concurrency:
      group: pages
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
